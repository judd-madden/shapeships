
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#000000" />
      <link rel="icon" href="/favicon.ico" sizes="any" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <link rel="manifest" href="/site.webmanifest" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      />
      <style>
        html,
        body {
          background: #000;
          height: 100%;
        }

        body {
          margin: 0;
          min-height: 100dvh;
        }

        #root {
          min-height: 100%;
        }

        html:not(.app-ready) #root {
          visibility: hidden;
        }
      </style>
      <!-- Search -->
      <title>Shapeships | Free Space Autobattler</title>
      <meta
        name="description"
        content="Shapeships is a free space strategy game. Build powerful fleets, roll dice. Desktop & mobile. No signup. Single Player & Multiplayer."
      />
      <link rel="canonical" href="https://shapeships.com/" />

      <!-- Open Graph: social and messaging link previews -->
      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Shapeships" />
      <meta property="og:url" content="https://shapeships.com/" />
      <meta
        property="og:title"
        content="Shapeships | Free Space Autobattler"
      />
      <meta
        property="og:description"
        content="Build powerful fleets in this free space strategy game. Desktop & mobile. No signup. Single Player & Multiplayer."
      />
      <meta
        property="og:image"
        content="https://shapeships.com/shapeships-social.png"
      />
      <meta property="og:image:type" content="image/png" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta
        property="og:image:alt"
        content="Shapeships space strategy game"
      />

      <!-- Twitter / X link previews -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta
        name="twitter:title"
        content="Shapeships | Free Space Autobattler"
      />
      <meta
        name="twitter:description"
        content="Build powerful fleets in this free space strategy game. Desktop & mobile. No signup. Single Player & Multiplayer."
      />
      <meta
        name="twitter:image"
        content="https://shapeships.com/shapeships-social.png"
      />
      <meta
        name="twitter:image:alt"
        content="Shapeships space strategy game"
      />

      <!-- Site identity -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Shapeships",
        "url": "https://shapeships.com/"
      }
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
